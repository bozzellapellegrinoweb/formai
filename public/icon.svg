<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151800"/>
      <stop offset="100%" stop-color="#070900"/>
    </linearGradient>
    <radialGradient id="atm" cx="72%" cy="22%" r="46%">
      <stop offset="0%" stop-color="#EAFF55" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EAFF55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFF55" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EAFF55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFF55" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#EAFF55" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cf" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!--
    ARC — same as arc-f: 270°, gap at top-left, r=192, center 256,256
    Start: (256, 64) [top], End: (64, 256) [left]
  -->

  <!-- Arc shadow halo -->
  <path d="M 256 64 A 192 192 0 1 1 64 256"
    stroke="white" stroke-width="82" stroke-linecap="round" fill="none" opacity="0.03"/>

  <!-- Main arc — white 270° -->
  <path d="M 256 64 A 192 192 0 1 1 64 256"
    stroke="white" stroke-width="44" stroke-linecap="round" fill="none" opacity="0.82"/>

  <!-- Lime segment — top 60° (270° → 330°) -->
  <path d="M 256 64 A 192 192 0 0 1 422 160"
    stroke="#EAFF55" stroke-width="44" stroke-linecap="round" fill="none"/>

  <!-- Glow at top-right -->
  <rect width="512" height="512" rx="112" fill="url(#atm)"/>

  <!--
    MESH — 5×5 dot grid centered at 256,256, spacing 58px
    Columns x: 141, 199, 257, 315, 373
    Rows    y: 141, 199, 257, 315, 373
    Dots fade by distance from center — inner bright, outer dim
    Lime cluster at center dots
  -->

  <!-- Core glow — radial lime halo at center -->
  <circle cx="230" cy="230" r="88" fill="url(#coreglow)"/>

  <!-- Lime cluster — 3 dots forming a tight constellation (upper-center-left) -->
  <!-- Main lime dot -->
  <circle cx="230" cy="220" r="46" fill="#EAFF55" opacity="0.10"/>
  <circle cx="230" cy="220" r="28" fill="#EAFF55" opacity="0.22"/>
  <circle cx="230" cy="220" r="16" fill="#EAFF55" filter="url(#cf)"/>
  <circle cx="230" cy="220" r="10" fill="#EAFF55"/>
  <circle cx="230" cy="220" r="3.5" fill="white" opacity="0.65"/>

  <!-- Secondary lime dot -->
  <circle cx="272" cy="258" r="26" fill="#EAFF55" opacity="0.12"/>
  <circle cx="272" cy="258" r="14" fill="#EAFF55" opacity="0.30"/>
  <circle cx="272" cy="258" r="7"  fill="#EAFF55"/>
  <circle cx="272" cy="258" r="2.5" fill="white" opacity="0.55"/>

  <!-- Tertiary lime dot — smallest -->
  <circle cx="199" cy="257" r="14" fill="#EAFF55" opacity="0.15"/>
  <circle cx="199" cy="257" r="7"  fill="#EAFF55" opacity="0.35"/>
  <circle cx="199" cy="257" r="4"  fill="#EAFF55"/>

  <!-- Arc terminus dot (top-right) -->
  <circle cx="422" cy="160" r="54" fill="url(#dg)"/>
  <circle cx="422" cy="160" r="27" fill="#EAFF55" filter="url(#gf)"/>
  <circle cx="422" cy="160" r="10" fill="white" opacity="0.55"/>

  <!-- Dim arc end cap (left) -->
  <circle cx="64" cy="256" r="11" fill="white" opacity="0.14"/>
</svg>
