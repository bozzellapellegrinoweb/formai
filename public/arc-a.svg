<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161900"/>
      <stop offset="100%" stop-color="#080a02"/>
    </linearGradient>
    <radialGradient id="atm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFF55" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#EAFF55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFF55" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#EAFF55" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#atm)"/>

  <!--
    Single clean arc, 270°, gap at bottom-right (between 315° and 45°, i.e. ±45° from right)
    r = 188, center 256,256, stroke 54

    Gap occupies 45° to 315° (the right quadrant corner), so arc runs from 45° to 315° CW = 270°

    Start at 45° (bottom-right):  256+188*cos(45°)=256+133=389, 256+188*sin(45°)=256+133=389
    End at 315° (top-right):      256+188*cos(315°)=389,        256+188*sin(315°)=256-133=123

    Arc from (389,389) CW 270° to (389,123): large-arc=1, sweep=1
    Path: M 389 389 A 188 188 0 1 1 389 123
  -->

  <!-- Shadow halo -->
  <path d="M 389 389 A 188 188 0 1 1 389 123"
    stroke="white" stroke-width="90" stroke-linecap="round" fill="none" opacity="0.03"/>

  <!-- Main arc — white, 270° CW from bottom-right to top-right -->
  <path d="M 389 389 A 188 188 0 1 1 389 123"
    stroke="white" stroke-width="54" stroke-linecap="round" fill="none" opacity="0.88"/>

  <!--
    Lime segment — last 70° of the arc approaching the top-right terminus (315°)
    70° before 315° going CW = 315° - 70° = 245°
    256+188*cos(245°)=256-79=177, 256+188*sin(245°)=256-170=86
    Wait, going CW means angles increase. The arc goes from 45° CW to 315° (= going 45→90→180→270→315 = 270°)
    70° before 315°: 315° - 70° = 245°
    Point at 245°: 256+188*cos(245°)=256+188*(-0.4226)=256-79=177, 256+188*sin(245°)=256+188*(-0.9063)=256-170=86

    Arc from (177,86) CW 70° to (389,123): large-arc=0, sweep=1
    M 177 86 A 188 188 0 0 1 389 123
  -->
  <path d="M 177 86 A 188 188 0 0 1 389 123"
    stroke="#EAFF55" stroke-width="54" stroke-linecap="round" fill="none"/>

  <!-- Lime dot at top-right terminus (315°) -->
  <circle cx="389" cy="123" r="56" fill="url(#dg)"/>
  <circle cx="389" cy="123" r="28" fill="#EAFF55" filter="url(#gf)"/>
  <circle cx="389" cy="123" r="10" fill="white" opacity="0.55"/>

  <!-- Dim cap at bottom-right start (45°) -->
  <circle cx="389" cy="389" r="12" fill="white" opacity="0.14"/>
</svg>
