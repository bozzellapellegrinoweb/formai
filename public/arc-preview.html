<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arc — Varianti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080a03;
    font-family: 'Poppins', 'Helvetica Neue', sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
    gap: 48px;
  }
  h1 {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
  .row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }
  .card img {
    width: 180px;
    height: 180px;
    border-radius: 40px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card img:hover {
    transform: scale(1.04);
    box-shadow: 0 0 40px rgba(234,255,85,0.15);
  }
  .tag {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
  }
  .name {
    font-size: 17px;
    font-weight: 700;
    color: white;
    text-align: center;
  }
  .desc {
    font-size: 12px;
    color: rgba(255,255,255,0.38);
    text-align: center;
    max-width: 170px;
    line-height: 1.6;
  }

  /* Big single view on click */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(12px);
    justify-content: center;
    align-items: center;
    z-index: 99;
    cursor: zoom-out;
  }
  .overlay.open { display: flex; }
  .overlay img { width: min(80vw, 380px); height: min(80vw, 380px); border-radius: 72px; }
</style>
</head>
<body>

<h1>Arc — 3 direzioni</h1>

<div class="row">

  <div class="card" onclick="open_('arc-a.svg')">
    <img src="arc-a.svg" alt="Arc A"/>
    <div class="tag">A</div>
    <div class="name">Momentum</div>
    <div class="desc">Arco bianco → lime. Gap a destra, dot in alto. Gradient di energia.</div>
  </div>

  <div class="card" onclick="open_('arc-b.svg')">
    <img src="arc-b.svg" alt="Arc B"/>
    <div class="tag">B</div>
    <div class="name">Orbit</div>
    <div class="desc">Due archi concentrici: bianco esterno + lime interno. Profondità orbitale.</div>
  </div>

  <div class="card" onclick="open_('arc-c.svg')">
    <img src="arc-c.svg" alt="Arc C"/>
    <div class="tag">C</div>
    <div class="name">Sweep</div>
    <div class="desc">Arco diagonale con texture stripes. Lime dot in alto-destra. Molto dinamico.</div>
  </div>

</div>

<!-- Fullscreen overlay -->
<div class="overlay" id="ov" onclick="this.classList.remove('open')">
  <img id="ovImg" src="" alt=""/>
</div>

<script>
function open_(src) {
  document.getElementById('ovImg').src = src;
  document.getElementById('ov').classList.add('open');
}
</script>
</body>
</html>
